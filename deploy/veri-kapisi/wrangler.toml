# Veri kapısı (14.10.2026, URUN-TASLAGI §16 Aşama 1). Pages (kimincenazesi-veri) önünde durur.
# Deploy: cd haber-motoru/tools/deploy && PATH=../node/bin:$PATH XDG_CONFIG_HOME=../../.cf ./node_modules/.bin/wrangler deploy --config ../../../cenaze-uygulamasi/deploy/veri-kapisi/wrangler.toml
# Secret (bir kez): wrangler secret put KC_ANAHTAR  (uygulamadaki cekirdek/anahtar.dart ile AYNI değer)
name = "kimincenazesi-veri-kapisi"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = false
routes = [{ pattern = "veri.kimincenazesi.com/*", zone_name = "kimincenazesi.com" }]

[vars]
KOKEN = "https://kimincenazesi-veri.pages.dev"
DAKIKA_LIMIT = "60"


# Hız sınırı: IP başına 60 istek / dakika — Durable Object sayacı (KV ve ratelimit bağlaması tutarsız çıktı)
[[durable_objects.bindings]]
name = "SAYAC"
class_name = "Sayac"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Sayac"]
