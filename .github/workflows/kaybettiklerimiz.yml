name: Kaybettiklerimiz haftalik

on:
  schedule:
    - cron: "0 1 * * 0"   # Pazar 01:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: kaybettiklerimiz
  cancel-in-progress: false

jobs:
  uret:
    runs-on: ubuntu-24.04   # 14.10.2026 sabitlendi: ubuntu-latest 19.10'da Ubuntu 26'ya gecer (kirilma riski)
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        id: co1
        continue-on-error: true
      - if: steps.co1.outcome == 'failure'
        run: sleep 60
      - if: steps.co1.outcome == 'failure'
        uses: actions/checkout@v4
        id: co2
        continue-on-error: true
      - if: steps.co1.outcome == 'failure' && steps.co2.outcome == 'failure'
        run: sleep 120
      - if: steps.co1.outcome == 'failure' && steps.co2.outcome == 'failure'
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tam uretim
        env:
          TEMIZ: "1"
        run: python3 okuyucu/kaybettiklerimiz.py
      - uses: actions/upload-artifact@v4
        with:
          name: kaybettiklerimiz
          path: veri/kaybettiklerimiz
          retention-days: 14
      - name: Depoya commit et
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add veri/kaybettiklerimiz
          if git diff --cached --quiet; then echo "degisiklik yok"; else git commit -m "kaybettiklerimiz: haftalik guncelleme $(date -u +%F)"; bash araclar/guvenli_push.sh "${GITHUB_REF_NAME}"; fi   # 16.10.2026 H76
