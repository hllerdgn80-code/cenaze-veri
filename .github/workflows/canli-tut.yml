name: Depoyu canli tut

on:
  schedule:
    - cron: "0 3 * * 1"   # Pazartesi 03:00 UTC (60 gun commitsizlikte zamanlanmis isler kapanmasin)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: canli-tut
  cancel-in-progress: false

jobs:
  canli:
    runs-on: ubuntu-24.04   # 14.10.2026 sabitlendi: ubuntu-latest 19.10'da Ubuntu 26'ya gecer (kirilma riski)
    timeout-minutes: 10   # 16.10.2026: olculen sure ~6 sn
    steps:
      - uses: actions/checkout@v4
        id: co1
        continue-on-error: true
      - if: steps.co1.outcome == 'failure'
        run: sleep 60
      - if: steps.co1.outcome == 'failure'
        uses: actions/checkout@v4
        id: co2
        continue-on-error: true
      - if: steps.co1.outcome == 'failure' && steps.co2.outcome == 'failure'
        run: sleep 120
      - if: steps.co1.outcome == 'failure' && steps.co2.outcome == 'failure'
        uses: actions/checkout@v4
      - name: Tarih yaz ve commit et
        run: |
          mkdir -p durum
          date -u +"%Y-%m-%dT%H:%M:%SZ" > durum/son-calisma.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add durum/son-calisma.txt
          git commit -m "canli tut: $(date -u +%F)"
          bash araclar/guvenli_push.sh "${GITHUB_REF_NAME}"   # 16.10.2026 H76: cakismaya dayanikli push
