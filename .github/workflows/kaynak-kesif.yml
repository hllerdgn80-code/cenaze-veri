name: Gunluk kaynak kesfi

# 14.10.2026 (URUN-TASLAGI §35/3): her gun Google Haberler RSS'inde "vefat etti / topraga verildi / son yolculuguna ugurlandi / cenaze namazi + il"
# taramasi yeni yerel kaynaklari bulur (yalniz kesif; icerik alinmaz), on inceleme yapar, arastirma/kesif/ADAYLAR.md'yi gunceller ve commit'ler.
# Gunluk <=30 sorgu; durum dosyasi (_kaynak_kesif_durum.json) imlec ve sayac tasir, commit'lenmezse kaybolur.
on:
  schedule:
    - cron: "17 3 * * *"   # TR 06:17
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  kesif:
    runs-on: ubuntu-24.04   # 14.10.2026 sabitlendi: ubuntu-latest 19.10'da Ubuntu 26'ya gecer (kirilma riski)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kesif
        run: python3 araclar/kaynak_kesif.py || echo "::warning::kesif hata verdi"
      - name: Sonucu commit'le
        run: |
          git config user.name "cenaze-bot"
          git config user.email "cenaze-bot@users.noreply.github.com"
          git add -A arastirma/kesif
          if git diff --cached --quiet; then echo "degisiklik yok"; else git commit -m "kesif: $(date -u +%F) adaylar" && git pull --rebase --autostash origin main && git push; fi
