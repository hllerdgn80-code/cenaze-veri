name: Denetim kaydi denemesi (gecici)
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  d:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: hllerdgn80-code/cenaze-veri/.github/actions/kod-al@main
        with:
          anahtar: ${{ secrets.KOD_DEPLOY_KEY_YAZ }}
          yayin: "0"
      - name: Denetim commit yolu (birebir)
        env:
          DENETIM_ZORLA: "1"
        run: |
          mkdir -p "$RUNNER_TEMP/denetim"; echo '{"deneme":1}' > "$RUNNER_TEMP/denetim/2026-10-99.json"
          H=$(date -u +%H)
          if [ "$H" -ge 18 ] || [ "${DENETIM_ZORLA:-0}" = "1" ]; then
            git checkout -q -- . || true
            mkdir -p deploy/denetim && cp "$RUNNER_TEMP"/denetim/*.json deploy/denetim/
            ls deploy/denetim | sort | head -n -14 | sed 's#^#deploy/denetim/#' | xargs -r git rm -q --cached 2>/dev/null || true
            if [ -n "$(git status --porcelain deploy/denetim)" ]; then
              git config user.name "cenaze-bot"; git config user.email "cenaze-bot@users.noreply.github.com"
              git add deploy/denetim && git commit -q -m "denetim: DENEME" && bash araclar/guvenli_push.sh
            fi
          fi
          git log --oneline -2
          # temizlik: deneme dosyasini sil
          git rm -q deploy/denetim/2026-10-99.json && git commit -q -m "denetim: deneme dosyasi silindi" && bash araclar/guvenli_push.sh
