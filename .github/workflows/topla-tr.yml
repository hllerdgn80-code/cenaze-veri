name: Turkiye'den oku

# Yalniz Turkiye'den acilan kaynaklar: site sahibinin Mac'indeki self-hosted runner'da calisir.
# topla.yml'den 6 dk ONCE (cron 47 -> 41) calisir; sonucu veri-tr/ klasorune commit eder,
# topla.yml birlestir adimi bu veriyi uzerine kopyalar.
on:
  schedule:
    - cron: "41 3,6,9,15 * * *"   # TR saatiyle 06:41 09:41 12:41 18:41 (Mac runner; 4 tur; 18:41 e-Devlet ikinci kosusu)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: topla-tr
  cancel-in-progress: false

env:
  TZ: Europe/Istanbul
  TR_ILLER: "kocaeli van mugla aksaray malatya"

jobs:
  oku-tr:
    runs-on: self-hosted
    timeout-minutes: 200   # 14.10.2026: e-Devlet nazik kullanim (hizmetler arasi 10 dk) kosuyu uzatir
    steps:
      - uses: actions/checkout@v4
      - name: Onceki veriyi geri yukle (biriktirme icin; depodaki son veri-tr/ — veri.tar.gz 08.10.2026'dan beri yayinlanmaz)
        run: |
          rm -rf veri onceki.tar.gz
          mkdir -p veri
          for il in $TR_ILLER; do
            if [ -d "veri-tr/$il" ]; then cp -r "veri-tr/$il" veri/; echo "onceki $il yuklendi"; fi
          done
      - name: Illeri oku (Turkiye'den)
        run: python3 okuyucu/hepsi.py $TR_ILLER
      - name: "e-Devlet vefat sorgulama (yalniz TR IP; nazik kullanim - 06 ve 18 kosulari, hizmetler arasi 10 dk, kosu basina en cok 60 istek; CAPTCHA gorunce 6 sa bekler)"
        env:
          EDEVLET_KOSU_SAATLERI: "06,18"
          EDEVLET_HIZMET_ARASI_SN: "600"
          EDEVLET_ISTEK_TAVANI: "60"
        run: python3 okuyucu/edevlet.py || echo "::warning::e-Devlet okuyucusu hata verdi"
      - name: veri-tr/ klasorunu hazirla
        run: |
          rm -rf veri-tr
          mkdir -p veri-tr
          for il in $TR_ILLER; do
            if [ -d "veri/$il" ]; then cp -r "veri/$il" veri-tr/; fi
          done
          # e-Devlet ciktilari (veri/<il>/_ulusal.json) tum iller icin tasinir; ana tur ulusal_birlestir ile katar
          for f in veri/*/_ulusal.json; do
            [ -f "$f" ] || continue
            il=$(basename "$(dirname "$f")"); mkdir -p "veri-tr/$il"; cp "$f" "veri-tr/$il/_ulusal.json"
          done
          python3 - <<'PY'
          import json, os
          iller = os.environ["TR_ILLER"].split()
          ozet = json.load(open("veri/ozet.json", encoding="utf-8"))
          cikti = {"guncelleme": ozet.get("guncelleme"),
                   "iller": {k: v for k, v in ozet.get("iller", {}).items() if k in iller}}
          json.dump(cikti, open("veri-tr/ozet-tr.json", "w", encoding="utf-8"), ensure_ascii=False, indent=1)
          print(sorted(cikti["iller"]))
          PY
      - name: Depoya commit et
        run: |
          git config user.name "cenaze-bot"
          git config user.email "cenaze-bot@users.noreply.github.com"
          git add -A veri-tr
          if git diff --cached --quiet; then
            echo "degisiklik yok, commit atilmadi"
          else
            git commit -m "veri-tr: Turkiye'den okunan iller"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true   # 14.10.2026 #13: veri/ altindaki okuma ciktilari (unstaged) rebase'i engelliyordu
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
