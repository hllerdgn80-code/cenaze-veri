name: Turkiye'den oku

# Yalniz Turkiye'den acilan kaynaklar: site sahibinin Mac'indeki self-hosted runner'da calisir.
# topla.yml'den 6 dk ONCE (cron 47 -> 41) calisir; sonucu veri-tr/ klasorune commit eder,
# topla.yml birlestir adimi bu veriyi uzerine kopyalar.
on:
  # 15.10.2026 H69: GitHub'in kendi zamanlayicisi KALDIRILDI — 12:41 tetiklemesini 4,5 saat gec (17:22) gonderip cift kosu
  # uretti ve checkout'ta GitHub depolama arizasiyla dustu ("Run failed" e-postasi). Saat artik yalniz sunucu zamanlayicisinda
  # (kc_tetikleyici.py: 06:41 09:41 12:41 18:41 TR + 10:05 bosluk) ve bekci (kimincenazesi_bekci.py) yedeginde.
  workflow_dispatch:
    inputs:
      mod:
        description: "normal = saatlik/4'lu tur; bosluk = 15.10.2026 BOSLUK TURU (bos illeri tespit et, yalniz onlarin e-Devlet hizmetlerini + ulusal akislari oku)"
        required: false
        default: "normal"
        type: choice
        options:
          - normal
          - bosluk
      zorla:
        description: "true = e-Devlet 06/18 saat kapisini bu kosuda atla (yalniz elle deneme; sunucu zamanlayicisi gondermez)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

concurrency:
  group: topla-tr
  cancel-in-progress: false

env:
  TZ: Europe/Istanbul
  TR_ILLER: "kocaeli van mugla aksaray malatya"

jobs:
  oku-tr:
    runs-on: self-hosted
    timeout-minutes: 200   # 14.10.2026: e-Devlet nazik kullanim (hizmetler arasi 10 dk) kosuyu uzatir
    steps:
      # 15.10.2026 H69: GitHub depolama arizasinda ("ServerBusy: egress over the account limit") ilk checkout duserse 60 sn sonra bir kez daha dene
      - uses: actions/checkout@v4
        id: co1
        continue-on-error: true
      - if: steps.co1.outcome == 'failure'
        run: sleep 60
      - if: steps.co1.outcome == 'failure'
        uses: actions/checkout@v4
      - name: Onceki veriyi geri yukle (biriktirme icin; depodaki son veri-tr/ — veri.tar.gz 08.10.2026'dan beri yayinlanmaz)
        run: |
          rm -rf veri onceki.tar.gz
          mkdir -p veri
          for il in $TR_ILLER; do
            if [ -d "veri-tr/$il" ]; then cp -r "veri-tr/$il" veri/; echo "onceki $il yuklendi"; fi
          done
          # 15.10.2026: onceki e-Devlet/ulusal ciktilari ve bosluk gecmisi de geri yuklenir (uzerine yazma yerine birlesir)
          for f in veri-tr/*/_ulusal.json; do
            [ -f "$f" ] || continue
            il=$(basename "$(dirname "$f")"); mkdir -p "veri/$il"; [ -f "veri/$il/_ulusal.json" ] || cp "$f" "veri/$il/_ulusal.json"
          done
          if [ -f veri-tr/_bosluk.json ]; then cp veri-tr/_bosluk.json veri/_bosluk.json; fi
      - name: Illeri oku (Turkiye'den)
        if: ${{ inputs.mod != 'bosluk' }}
        run: python3 okuyucu/hepsi.py $TR_ILLER
      - name: "e-Devlet vefat sorgulama (yalniz TR IP; nazik kullanim - 06 ve 18 kosulari, hizmetler arasi 10 dk, kosu basina en cok 60 istek; CAPTCHA gorunce 6 sa bekler)"
        if: ${{ inputs.mod != 'bosluk' }}
        env:
          EDEVLET_KOSU_SAATLERI: "06,18"
          EDEVLET_HIZMET_ARASI_SN: "600"
          EDEVLET_ISTEK_TAVANI: "80"
          EDEVLET_ZORLA: ${{ inputs.zorla == 'true' && '1' || '0' }}
        run: python3 okuyucu/edevlet.py || echo "::warning::e-Devlet okuyucusu hata verdi"
      # ---- BOSLUK TURU (15.10.2026; mod=bosluk; 10:05 TR'de sunucu zamanlayicisi tetikler): site sahibi "bosluklar 10:00'a kadar beklensin, hala bos varsa kendi
      # imkanlarimizla doldurulsun". Canli veriden bugun cenaze kaydi olmayan iller bulunur; yalniz onlarin e-Devlet hizmetleri + ulusal akislar okunur.
      # Nazik kullanim AYNEN: hizmetler arasi 10 dk, kosu basina <=40 istek, captcha'da geri cekilme, haftalik atlama (edevlet.py).
      - name: "Bosluk: bugun cenaze kaydi olmayan illeri bul (canli veri)"
        if: ${{ inputs.mod == 'bosluk' }}
        run: python3 araclar/bosluk.py --tespit --canli --etiket tr-bosluk
      - name: "Bosluk: bos illerin e-Devlet hizmetleri (yalniz TR IP; saat kapisi bu adimda EDEVLET_ZORLA=1 ile atlanir)"
        if: ${{ inputs.mod == 'bosluk' }}
        env:
          EDEVLET_YALNIZ: "1"
          EDEVLET_ZORLA: "1"
          EDEVLET_HIZMET_ARASI_SN: "600"
          EDEVLET_ISTEK_TAVANI: "40"
        run: |
          export EDEVLET_ONCELIK="$(python3 araclar/bosluk.py --oncelik)"
          echo "e-Devlet bosluk listesi: ${EDEVLET_ONCELIK:-<bos: eslesen hizmet yok>}"
          python3 okuyucu/edevlet.py || echo "::warning::e-Devlet okuyucusu hata verdi"
      - name: "Bosluk: ulusal akislar (vefatilan, sondakika, bos illerin cenazeilanlari sayfasi)"
        if: ${{ inputs.mod == 'bosluk' }}
        run: |
          python3 okuyucu/vefatilan.py || echo "::warning::vefatilan okunamadi"
          python3 okuyucu/sondakika.py || echo "::warning::sondakika okunamadi"
          BOS="$(python3 araclar/bosluk.py --il-listesi)"
          if [ -n "$BOS" ]; then python3 okuyucu/cenazeilanlari.py --il "$BOS" || echo "::warning::cenazeilanlari okunamadi"; else echo "bos il yok"; fi
      - name: veri-tr/ klasorunu hazirla (bosluk modu; mevcut veri-tr korunur, yalniz _ulusal.json ve _bosluk.json guncellenir)
        if: ${{ inputs.mod == 'bosluk' }}
        run: |
          mkdir -p veri-tr
          for f in veri/*/_ulusal.json; do
            [ -f "$f" ] || continue
            il=$(basename "$(dirname "$f")"); mkdir -p "veri-tr/$il"; cp "$f" "veri-tr/$il/_ulusal.json"
          done
          if [ -f veri/_bosluk.json ]; then cp veri/_bosluk.json veri-tr/_bosluk.json; fi
      - name: veri-tr/ klasorunu hazirla
        if: ${{ inputs.mod != 'bosluk' }}
        run: |
          rm -rf veri-tr
          mkdir -p veri-tr
          for il in $TR_ILLER; do
            if [ -d "veri/$il" ]; then cp -r "veri/$il" veri-tr/; fi
          done
          # e-Devlet ciktilari (veri/<il>/_ulusal.json) tum iller icin tasinir; ana tur ulusal_birlestir ile katar
          for f in veri/*/_ulusal.json; do
            [ -f "$f" ] || continue
            il=$(basename "$(dirname "$f")"); mkdir -p "veri-tr/$il"; cp "$f" "veri-tr/$il/_ulusal.json"
          done
          if [ -f veri/_bosluk.json ]; then cp veri/_bosluk.json veri-tr/_bosluk.json; fi
          python3 - <<'PY'
          import json, os
          iller = os.environ["TR_ILLER"].split()
          ozet = json.load(open("veri/ozet.json", encoding="utf-8"))
          cikti = {"guncelleme": ozet.get("guncelleme"),
                   "iller": {k: v for k, v in ozet.get("iller", {}).items() if k in iller}}
          json.dump(cikti, open("veri-tr/ozet-tr.json", "w", encoding="utf-8"), ensure_ascii=False, indent=1)
          print(sorted(cikti["iller"]))
          PY
      - name: Depoya commit et
        run: |
          git config user.name "cenaze-bot"
          git config user.email "cenaze-bot@users.noreply.github.com"
          git add -A veri-tr
          if git diff --cached --quiet; then
            echo "degisiklik yok, commit atilmadi"
          else
            git commit -m "veri-tr: Turkiye'den okunan iller"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true   # 14.10.2026 #13: veri/ altindaki okuma ciktilari (unstaged) rebase'i engelliyordu
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
