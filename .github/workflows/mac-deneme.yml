name: Mac anlik yayin denemesi (gecici)
on:
  workflow_dispatch: {}
permissions:
  contents: read
  actions: write
jobs:
  d:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: hllerdgn80-code/cenaze-veri/.github/actions/kod-al@main
        with:
          anahtar: ${{ secrets.KOD_DEPLOY_KEY_YAZ }}
          yayin-sparse: |
            uygulama/assets/veri
      - name: anlik_yayin denemesi (gecici dal)
        env:
          GH_TOKEN: ${{ github.token }}
          KC_ANLIK_DAL: deneme-anlik
        run: |
          git config user.name cenaze-bot; git config user.email cenaze-bot@users.noreply.github.com
          git push origin HEAD:refs/heads/deneme-anlik
          mkdir -p veri/ordu; echo '{"il":"Ordu","kayitlar":[],"guncelleme":"deneme"}' > veri/ordu/_ulusal.json
          python3 -c "
          import sys; sys.path.insert(0,'okuyucu'); import edevlet; edevlet.anlik_yayin('ordu','veri/ordu/_ulusal.json')"
          git fetch origin deneme-anlik
          git log --oneline -2 FETCH_HEAD
          git show FETCH_HEAD:veri-tr/ordu/_ulusal.json
          git push origin --delete deneme-anlik
