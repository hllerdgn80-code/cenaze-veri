name: Cenaze ilanlarini topla

on:
  schedule:
    - cron: "47 3,5,6,7,8,9,12,18 * * *"   # TR saatiyle 06:47 08:47 09:47 10:47 11:47 12:47 15:47 21:47 (cenazelerin %57si öğle)
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: topla
  cancel-in-progress: false

env:
  CENAZE_HIZLI: "1"
  TZ: Europe/Istanbul
  CENAZE_KOPRU: ${{ secrets.CENAZE_KOPRU }}
  CENAZE_KOPRU_ANAHTAR: ${{ secrets.CENAZE_KOPRU_ANAHTAR }}

jobs:
  oku:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        grup: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Onceki IC veri (biriktirme icin) GitHub onbelleginden gelir; onbellek herkese acik DEGILDIR (08.10.2026: veri.tar.gz artik yayinlanmaz)
      - name: Onceki ic veriyi onbellekten geri yukle
        id: onbellek
        uses: actions/cache/restore@v4
        with:
          path: veri
          key: veri-ic-${{ github.run_id }}
          restore-keys: veri-ic-
      - name: Onbellek yoksa eski yayin paketini dene (yalniz gecis icin)
        if: steps.onbellek.outputs.cache-matched-key == ''
        run: |
          mkdir -p veri
          URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/veri.tar.gz"
          if curl -sfL "$URL" -o onceki.tar.gz; then tar -xzf onceki.tar.gz; echo "onceki veri (gecis paketi) yuklendi"; else echo "onceki veri yok (ilk calisma)"; fi
      - name: Okuyuculari calistir (grup ${{ matrix.grup }}/4)
        run: |
          python3 okuyucu/hepsi.py --grup ${{ matrix.grup }}/4
          python3 okuyucu/hepsi.py --grup ${{ matrix.grup }}/4 --sadece-grubu-birak
      - uses: actions/upload-artifact@v4
        with:
          name: veri-grup-${{ matrix.grup }}
          path: veri
          retention-days: 1

  birlestir:
    needs: oku
    if: ${{ always() && needs.oku.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Onceki ic veriyi onbellekten geri yukle
        id: onbellek
        uses: actions/cache/restore@v4
        with:
          path: veri
          key: veri-ic-${{ github.run_id }}
          restore-keys: veri-ic-
      - name: Onceki ozeti ayir (onbellek yoksa eski yayin paketi, yalniz gecis icin)
        run: |
          mkdir -p veri
          if [ -z "${{ steps.onbellek.outputs.cache-matched-key }}" ]; then
            URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/veri.tar.gz"
            if curl -sfL "$URL" -o onceki.tar.gz; then tar -xzf onceki.tar.gz; echo "onceki veri (gecis paketi) yuklendi"; else echo "onceki veri yok (ilk calisma)"; fi
          fi
          if [ -f veri/ozet.json ]; then cp veri/ozet.json onceki-ozet.json; fi
      - uses: actions/download-artifact@v4
        with:
          pattern: veri-grup-*
          path: gruplar
      - name: Gruplari birlestir
        run: |
          for g in gruplar/*/; do cp -r "$g". veri/; done
          python3 okuyucu/hepsi.py --ozet-birlestir
          # Turkiye'den (self-hosted runner) okunan iller: veri-tr/ klasoru depoda
          if [ -f veri-tr/ozet-tr.json ]; then
            if python3 - <<'PY'
          import json, sys
          from datetime import datetime, timezone
          g = json.load(open("veri-tr/ozet-tr.json", encoding="utf-8")).get("guncelleme")
          try:
              yas = (datetime.now(timezone.utc) - datetime.fromisoformat(g).astimezone(timezone.utc)).total_seconds() / 3600
          except Exception:
              yas = 9999
          print(f"veri-tr yasi: {yas:.1f} saat")
          sys.exit(0 if yas <= 36 else 1)
          PY
            then
              for d in veri-tr/*/; do cp -r "$d" veri/; done
              python3 okuyucu/hepsi.py --ozet-ekle veri-tr/ozet-tr.json
            else
              echo "::warning::TR runner calismiyor (veri-tr 36 saatten eski), yurt disi okumasi kullaniliyor"
            fi
          else
            echo "::warning::TR runner calismiyor (veri-tr/ozet-tr.json yok)"
          fi
          rm -f veri/ozet.[0-9]*.json
          python3 okuyucu/kapi.py   # yayın öncesi makine denetçisi (veri/kapi.json, veri/<il>/_kapi_red.json)
      - name: Saglik denetimi (basarisiz yapmaz)
        run: python3 okuyucu/saglik.py onceki-ozet.json || true
      - name: Ic veriyi onbellege kaydet (sonraki tur buradan biriktirir; yayina GITMEZ)
        uses: actions/cache/save@v4
        with:
          path: veri
          key: veri-ic-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Yayin klasorunu hazirla
        run: |
          mkdir -p site
          cp -r veri site/
          # depodaki haftalik Kaybettiklerimiz verisi (checkout'ta veri/kaybettiklerimiz) site'a girsin
          mkdir -p site/veri/kaybettiklerimiz
          if [ -d veri/kaybettiklerimiz ]; then cp -r veri/kaybettiklerimiz/. site/veri/kaybettiklerimiz/; fi
          # YAYIN SUZGECI (URUN-TASLAGI §16.5, §28): yerel basin/haber kayit ve illeri, kaynak_ad/kaynak_url/ham/anne_baba cikar.
          # Suzgec kendini denetler; sizinti kalirsa cikis kodu 1 -> is DURUR, yayin yapilmaz.
          python3 okuyucu/yayin_suz.py site/veri
          # Uygulamanin gizlilik politikasi (Play Console URL'si; alan adi alininca tasinir)
          if [ -f uygulama/web/gizlilik.html ]; then cp uygulama/web/gizlilik.html site/kimincenazesi-gizlilik.html; fi
          echo '<!doctype html><meta charset="utf-8"><title>Cenaze veri</title><p>Veri: <a href="veri/ozet.json">ozet.json</a> · <a href="veri/saglik.json">saglik.json</a></p>' > site/index.html
          python3 -c "import json;d=json.load(open('veri/ozet.json'))['iller'];[print(v.get('il_adi',k),v.get('kayit_sayisi'),v.get('hata') or '') for k,v in d.items()]"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
