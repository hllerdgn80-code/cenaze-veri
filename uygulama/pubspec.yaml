name: kimin_cenazesi
description: "Kimin Cenazesi — il ve ilçenizdeki cenaze ilanları."
publish_to: "none"
version: 0.1.5+14

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  share_plus: ^11.0.0
  url_launcher: ^6.3.1
  flutter_svg: ^2.0.16
  workmanager: ^0.10.10
  flutter_local_notifications: ^22.3.2
  google_mlkit_text_recognition: ^0.17.1   # cihaz içi (internetsiz) metin tanıma: kartta TC karartma; Android minSdk 21+, ~+10 MB
  image: ^4.12.0                           # piksel düzeyinde karartma + 1600 px küçültme (saf Dart)
  image_picker: ^1.2.4   # kart fotoğrafı (kamera/galeri); maxWidth/maxHeight ile cihazda küçültülür, ek "image" paketi gerekmez

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/veri/
    - assets/ikon/

# Uygulama simgesi: L13 altin zemin (sahibi 14.10.2026: koyu zemin telefonda sonuk kaliyordu). CI'da `dart run flutter_launcher_icons` ile üretilir.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/ikon/ikon.png"
  adaptive_icon_background: "#C9A45C"
  adaptive_icon_foreground: "assets/ikon/ikon_on.png"
  min_sdk_android: 21
